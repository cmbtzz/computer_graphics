# 启用的插件列表，注释/删除对应项即可关闭功能
active_plugins:
  - experiment1_color # 实验一：HSV/RGB 与 RGB 立方体
  - view_orientation # 右上角 XYZ 指示器，缩放时保持屏幕大小
  - transform_control # 选中模型的位置、旋转、缩放数值面板
  - light_control   # 整个场景的灯光与光照效果开关
  - material_control # 当前物体的材质参数及预设
  - texture_mapping # 纹理贴图插件
  - mipmap_mapping  # 普通贴图的六种过滤方式
  - environment_mapping # 同一张全景图的模型反射和背景
  - ray_tracing # 独立光线追踪页签：中心窗口实时渲染 OBJ 场景
  - view_toolbar    # 顶部工具栏插件
